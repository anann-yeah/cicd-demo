---
# Configures a fresh Ubuntu 24.04 VM as a Jenkins CI/CD server (configuration management).
# Run ON the VM:  sudo ansible-playbook -i ansible/inventory.ini ansible/setup-jenkins-server.yml
- name: Prepare the Jenkins server
  hosts: local
  become: true
  gather_facts: false

  tasks:
    - name: Install Java 21, Maven, Git, Docker and helper packages
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jdk
          - maven
          - git
          - curl
          - wget
          - docker.io
          - ansible-core
        state: present
        update_cache: true

    - name: Install kubectl
      ansible.builtin.command: snap install kubectl --classic
      args:
        creates: /snap/bin/kubectl

    - name: Make kubectl visible to the Jenkins service
      ansible.builtin.file:
        src: /snap/bin/kubectl
        dest: /usr/local/bin/kubectl
        state: link

    - name: Download the Jenkins package signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add the Jenkins LTS apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Let the jenkins user run Docker
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true
      notify: Restart Jenkins

    - name: Start and enable Docker and Jenkins
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - jenkins

    - name: Wait for Jenkins to create its first-run password
      ansible.builtin.wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
        timeout: 180

    - name: Read the initial admin password
      ansible.builtin.command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password
      changed_when: false

    - name: Show how to log in
      ansible.builtin.debug:
        msg:
          - "Open http://<this VM's public IP>:8080"
          - "Initial admin password: {{ jenkins_password.stdout }}"

  handlers:
    - name: Restart Jenkins
      ansible.builtin.service:
        name: jenkins
        state: restarted
